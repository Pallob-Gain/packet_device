[package]
name = "packet-device"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Packet Device protocol and DevicePacketParser for desktop and ESP-IDF Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Pallob-Gain/packet_device"
documentation = "https://docs.rs/packet-device"
keywords = ["protocol", "serial", "embedded", "esp32", "packet"]
categories = ["embedded", "encoding", "network-programming"]
publish = ["crates-io"]
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/PARITY.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependencies]

[workspace]
